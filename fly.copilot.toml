# Fly.io config for the "neo4gen-copilot" app: thin Bun/Hono CopilotKit runtime.
# Deploy from repo root:  fly deploy ./src/copilot-runtime -c ./fly.copilot.toml
app = "neo4gen-copilot"
primary_region = "arn"

[env]
  PORT = "8000"
  NODE_ENV = "production"
  COPILOTKIT_TELEMETRY_DISABLED = "true"
  # Public URL of the neo4gen server's AG-UI endpoint.
  AGENT_URL = "https://neo4gen.fly.dev/agui"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
